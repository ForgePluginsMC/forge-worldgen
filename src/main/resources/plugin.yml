name: ForgeWorldGen
version: '3.1.3'
main: com.forgeplugins.worldgen.ForgeWorldGen
api-version: '26.3'
author: Forge
description: Staged-pipeline custom world generation — volcanoes, mountain ranges, rivers, scablands, custom biomes and surfaces.
commands:
  fgen:
    description: Manage ForgeWorldGen worlds, pre-generation and verification
    usage: /fgen <create|tp|pregen|cancel|reload|verify|biome>
    permission: fgen.tp
permissions:
  fgen.admin:
    description: Create worlds, pre-generate, cancel, reload and verify ForgeWorldGen
    default: op
  fgen.tp:
    description: Teleport to ForgeWorldGen worlds and inspect biomes
    default: op
