# ============================================================
# ForgeWorldGen v3 configuration — staged-pipeline world generation.
#
# Terrain comes from our own engine (volcanoes, mountain ranges, rivers,
# scabland coulees); biomes are ours too, each mapped to a vanilla
# derivative so vanilla decorations, structures and mobs keep working.
# Caves, decorations, structures and mobs stay vanilla (toggled below).
# ============================================================

generation:
  # Ocean level. Terrain below this fills with water.
  sea-level: 62

terrain:
  # Mountain range amplification, 0.0 (flat) to 2.5 (epic). 1.0 is default.
  mountain-amplification: 1.0
  # Chance per 1536-block grid cell of holding a volcano, 0.0 to 1.0.
  # 0.06 ≈ one volcano every ~40x40 chunks on average.
  volcano-rarity: 0.06
  # River valleys carved into the terrain.
  rivers: true
  # Scabland coulee channels on plateau country (Dry Falls flavor).
  scablands: true

features:
  # Vanilla cave carvers running on ForgeWorldGen terrain.
  caves: true
  # Vanilla decorations (ores, trees, flowers, etc.) on ForgeWorldGen terrain.
  decorations: true
  # Vanilla structures (villages, etc.) on ForgeWorldGen terrain.
  structures: true
  # Mob spawning.
  mobs: true

world:
  # Re-attach the ForgeWorldGen generator to managed worlds on startup,
  # so restarts never silently fall back to vanilla generation at borders.
  auto-manage: true

# Worlds created by /fgen create. Do not edit by hand unless you know
# what you are doing — the plugin maintains this list.
managed-worlds: []

messages:
  prefix: "<gold>[ForgeWorldGen]</gold> "
