# ============================================================
# ForgeWorldGen v2 configuration — back to basics.
# One change over vanilla: gentle terrain smoothing.
# Everything else (biomes, trees, caves, structures) is vanilla.
# ============================================================

generation:
  # Ocean level. Terrain below this fills with water.
  sea-level: 62

terrain:
  # Gentle low-pass smoothing on the heightfield, 0.0 (off) to 1.0.
  # 0.35 is the subtle default: softens jagged edges, keeps character.
  smoothing: 0.35

features:
  # Vanilla cave carvers running on ForgeWorldGen terrain.
  caves: true
  # Vanilla decorations (ores, trees, flowers, etc.) on ForgeWorldGen terrain.
  decorations: true
  # Vanilla structures (villages, etc.) on ForgeWorldGen terrain.
  structures: true
  # Mob spawning.
  mobs: true

world:
  # Re-attach the ForgeWorldGen generator to managed worlds on startup,
  # so restarts never silently fall back to vanilla generation at borders.
  auto-manage: true

# Worlds created by /fgen create. Do not edit by hand unless you know
# what you are doing — the plugin maintains this list.
managed-worlds: []

messages:
  prefix: "<gold>[ForgeWorldGen]</gold> "
